<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Биотехнология 26.4 — Расписание</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
:root{--navy:#050a3a;--cyan:#22d3ff;--red:#e8141c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat','Segoe UI',Arial,sans-serif;font-style:italic;font-weight:700;color:#fff;background:var(--navy);min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}

.bg{position:fixed;inset:0;z-index:-2;background:
 radial-gradient(55% 45% at 88% 18%,rgba(255,255,255,.6),transparent 65%),
 radial-gradient(50% 40% at 15% 95%,rgba(34,211,255,.65),transparent 70%),
 repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 36px,transparent 36px 120px),
 linear-gradient(160deg,#0a12b0 0%,#0b3cff 45%,#18c4ff 100%)}
.bg::after{content:"";position:absolute;left:-10%;top:-20%;width:45%;height:150%;background:#000;opacity:.85;transform:skewX(-14deg)}
.mark{position:fixed;left:-1vw;bottom:4vh;z-index:-1;font-size:min(14vw,190px);font-weight:900;text-transform:uppercase;line-height:.8;white-space:nowrap;color:rgba(255,255,255,.2);transform:rotate(-10deg);transform-origin:left bottom;pointer-events:none}

.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;max-width:1000px;margin:0 auto;padding:18px 20px 0}
.plate{background:#000;border:2px solid #fff;padding:6px 20px;transform:skewX(-12deg);font-weight:800;font-size:1.05rem}
.plate span{display:inline-block;transform:skewX(12deg)}

.wrap{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:44px;max-width:1000px;margin:0 auto;padding:34px 20px 110px}
.menu{display:flex;flex-direction:column;gap:8px;transform:rotate(-8deg);transform-origin:left center;padding-top:16px}
.day{text-align:left;font-weight:900;font-size:clamp(1.4rem,3.2vw,2.15rem);color:var(--cyan);padding:2px 18px;transform:skewX(-8deg);text-shadow:2px 2px 0 var(--navy),-1px -1px 0 var(--navy);transition:transform .12s}
.day:hover{color:#fff}
.day.on{color:#fff;background:var(--red);box-shadow:0 0 0 3px #fff,7px 7px 0 #000;transform:skewX(-8deg) translateX(14px) scale(1.06);text-shadow:none}

.panel{display:flex;flex-direction:column;gap:12px}
.head{background:#000;border-left:10px solid #fff;padding:10px 28px;transform:skewX(-12deg);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.head>*{transform:skewX(12deg)}
.head h2{font-size:1.7rem;font-weight:900}
.head small{color:var(--cyan);font-size:.9rem}

.les{background:#000;border-right:6px solid var(--cyan);transform:skewX(-12deg);animation:in .28s both}
.in{transform:skewX(12deg);display:flex;align-items:center;gap:16px;padding:12px 26px 12px 0}
.time{background:#fff;color:#000;font-weight:900;padding:8px 14px 8px 22px;min-width:132px;text-align:center;font-size:.85rem}
.txt{flex:1;min-width:0}
.txt h3{font-size:1.05rem;font-weight:800;line-height:1.25}
.txt p{color:var(--cyan);font-size:.88rem;margin-top:3px}
.kind{font-size:.72rem;font-weight:800;padding:3px 12px;border-radius:99px;white-space:nowrap;background:#33389a;color:#dfe4ff}

.empty{background:#000;padding:20px 28px;transform:skewX(-12deg);text-align:center;font-size:1.2rem}
@keyframes in{from{opacity:0;transform:skewX(12deg) translate(-34px, 0)}}

#splash{position:fixed;inset:0;z-index:50;background:linear-gradient(135deg,#050a3a,#0a12b0);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity 0.5s ease;user-select:none}
.t1{font-size:min(10vw,80px);font-weight:900;text-shadow:4px 4px 0 var(--red), 8px 8px 0 #000;margin-bottom:10px}
.t2{font-size:min(18vw,140px);font-weight:900;color:var(--cyan);text-shadow:5px 5px 0 #000}
.tap{margin-top:40px;font-size:1.2rem;letter-spacing:2px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}
</style>
</head>
<body>

<div id="splash" onclick="this.style.opacity=0;setTimeout(()=>this.style.display='none',500)">
    <div class="t1">СЕГОДНЯ</div>
    <div class="t2">РАСПИСАНИЕ</div>
    <div class="tap">КЛИКНИ ДЛЯ ВХОДА<small><br>PERSONA 3 STYLE</small></div>
</div>

<div class="bg"></div>
<div class="mark">P3 RELOAD</div>

<div class="top">
    <div class="plate"><span>10 Г класс</span></div>
    <div class="plate"><span>Октябрь 2026</span></div>
</div>

<div class="wrap">
    <div class="menu">
        <button class="day on" onclick="showDay('пн', this)">ПОНЕДЕЛЬНИК</button>
        <button class="day" onclick="showDay('вт', this)">ВТОРНИК</button>
        <button class="day" onclick="showDay('ср', this)">СРЕДА</button>
        <button class="day" onclick="showDay('чт', this)">ЧЕТВЕРГ</button>
        <button class="day" onclick="showDay('пт', this)">ПЯТНИЦА</button>
    </div>

    <div class="panel" id="lessons-container">
        <!-- Сюда скрипт выведет уроки выбранного дня -->
    </div>
</div>

<script>
const schedule = {
    "пн": [
        {time: "08:00-08:45", name: "Разговоры о важном 10 Г", room: "к314"},
        {time: "08:50-09:30", name: "Математика", room: "к226"},
        {time: "09:45-10:25", name: "Математика", room: "к226"},
        {time: "10:40-11:20", name: "Русский язык", room: "к314"},
        {time: "11:30-12:10", name: "Русский язык", room: "к314"},
        {time: "12:20-13:00", name: "Химия", room: "к421"},
        {time: "13:15-13:55", name: "Биология", room: "к421"},
        {time: "14:05-14:45", name: "Физика", room: "к1037"},
        {time: "15:00-15:40", name: "Физика", room: "к1037"},
        {time: "15:50-16:30", name: "Иностранный (английский) язык", room: "к324"}
    ],
    "вт": [
        {time: "08:50-09:30", name: "История", room: "к330"},
        {time: "09:45-10:25", name: "История", room: "к330"},
        {time: "10:40-11:20", name: "Физическая культура", room: "кБСЗ"},
        {time: "11:30-12:10", name: "Физическая культура", room: "кБСЗ"},
        {time: "12:20-13:00", name: "Иностранный (английский) язык", room: "к324"},
        {time: "13:15-13:55", name: "Иностранный (английский) язык", room: "к324"},
        {time: "14:05-14:45", name: "Практикум ЕГЭ по обществознанию", room: "к330"},
        {time: "15:00-15:40", name: "Практикум ЕГЭ по обществознанию", room: "к330"}
    ],
    "ср": [
        {time: "08:50-09:30", name: "Обществознание", room: "к330"},
        {time: "09:45-10:25", name: "Обществознание", room: "к330"},
        {time: "10:40-11:20", name: "Литература", room: "к314"},
        {time: "11:30-12:10", name: "Математика", room: "к226"},
        {time: "12:20-13:00", name: "Математика", room: "к226"},
        {time: "13:15-13:55", name: "Иностранный (английский) язык", room: "к324"},
        {time: "14:05-14:45", name: "Иностранный (английский) язык", room: "к324"},
        {time: "15:00-15:40", name: "Практикум ЕГЭ по английскому языку", room: "к324"},
        {time: "15:00-15:45", name: "Практикум ЕГЭ по английскому языку", room: "к324"}
    ],
    "чт": [
        {time: "08:00-08:45", name: "Группа 'Россия - мои горизонты' СОО", room: "к314"},
        {time: "08:50-09:30", name: "Основы безопасности и защиты Родины", room: "к349"},
        {time: "12:20-13:00", name: "Индивидуальный проект", room: "к421"},
        {time: "14:05-14:45", name: "Информатика", room: "к238"},
        {time: "15:00-15:40", name: "География", room: "к333"}
    ],
    "пт": [
        {time: "08:00-08:40", name: "Обществознание", room: "к330"},
        {time: "08:50-09:30", name: "Обществознание", room: "к330"},
        {time: "09:45-10:25", name: "Математика", room: "к226"},
        {time: "10:40-11:20", name: "Практикум ЕГЭ по математике (база)", room: "к226"},
        {time: "11:30-12:10", name: "Литература", room: "к314"},
        {time: "12:20-13:00", name: "Литература", room: "к314"}
    ]
};

function showDay(dayCode, buttonEl) {
    document.querySelectorAll('.day').forEach(b => b.classList.remove('on'));
    if(buttonEl) buttonEl.classList.add('on');

    const container = document.getElementById('lessons-container');
    container.innerHTML = '';

    const daysFull = {"пн":"ПОНЕДЕЛЬНИК","вт":"ВТОРНИК","ср":"СРЕДА","чт":"ЧЕТВЕРГ","пт":"ПЯТНИЦА"};
    
    let headHTML = `<div class="head"><h2><span>${daysFull[dayCode]}</span></h2><small><span>10 Г КЛАСС</span></small></div>`;
    container.innerHTML += headHTML;

    const lessons = schedule[dayCode];
    if(!lessons || lessons.length === 0) {
        container.innerHTML += `<div class="empty"><span>КАЙФ, ПАР НЕТ!</span></div>`;
        return;
    }

    lessons.forEach((les, index) => {
        let lesHTML = `
        <div class="les" style="--n: ${index}">
            <div class="in">
                <div class="time">${les.time}</div>
                <div class="txt">
                    <h3>${les.name}</h3>
                    <p>${les.room}</p>
                </div>
                <div class="kind">УРОК</div>
            </div>
        </div>`;
        container.innerHTML += lesHTML;
    });
}

// Запуск по умолчанию (Понедельник)
showDay('пн');
</script>
</body>
</html>
